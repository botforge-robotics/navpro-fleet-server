worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;

  # Websocket upgrade helper.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
  }

  # Single HTTP entry (LAN). TLS can be re-enabled later; for now avoid
  # self-signed HTTPS friction and mixed-content issues on the GUI.
  server {
    listen 80;
    server_name _;

    client_max_body_size 200m;   # map uploads, large payloads

    # --- GUI static bundle (baked into this nginx image) --------------------
    root /usr/share/nginx/html;
    index index.html;

    location / {
      try_files $uri $uri/ /index.html;
    }

    # --- Platform API: platform-native routes -------------------------------
    location /api/ {
      proxy_pass http://platform-api:8080;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 3600s;   # long-lived websocket (/api/v1/ws)
    }

    # --- Robot path / traffic schedule (schedule visualizer on host :8006) --
    # Separate from rmf-api-server. The GUI connects to /rmf/trajectory; the
    # Open-RMF schedule_visualizer listens on the host (demo) or rmf-core.
    # host.docker.internal is provided via compose extra_hosts.
    location /rmf/trajectory {
      proxy_pass http://host.docker.internal:8006/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 3600s;
    }

    # --- Platform API: RMF-compatible proxy family --------------------------
    # The GUI's rmf api-client points here. The Platform API enforces auth +
    # audit, then forwards to rmf-api-server inside the Docker network. The
    # real api-server is never exposed outside.
    location /rmf/ {
      proxy_pass http://platform-api:8080;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 3600s;   # socket.io subscriptions
    }

    # --- Robot log ingestion (Loki push API) ---------------------------------
    # Robots ship journald/ROS logs here (see docs/LOGGING.md). Guarded by the
    # provisioning token header; Loki itself is never exposed directly.
    location /loki/api/v1/push {
      if ($http_x_provisioning_token = "") {
        return 401;
      }
      proxy_pass http://loki:3100;
      proxy_set_header Host $host;
    }

    # --- Official rmf_traffic_editor (noVNC) --------------------------------
    # Qt traffic-editor from https://github.com/open-rmf/rmf_traffic_editor
    # Embedded in the GUI Building tab as /editor/
    location /editor/ {
      proxy_pass http://traffic-editor:6080/;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 3600s;
      proxy_buffering off;
    }

    # --- Grafana (sub-path) --------------------------------------------------
    location /grafana/ {
      proxy_pass http://grafana:3000;
      proxy_set_header Host $host;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
