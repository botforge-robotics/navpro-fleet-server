# Example minimal RMF building file for the sim scale test
# (docs/SIM_SCALE_TEST.md): 2 levels, 1 lift, a narrow ONE-WAY corridor pair
# on L1, chargers, and a door on L2.
#
# Author the real site building in rmf_traffic_editor and import it via the
# Platform API. This example exists so the sim harness runs out of the box;
# it follows the building.yaml schema of rmf_building_map_tools.
name: navpro_example
levels:
  L1:
    elevation: 0
    vertices:
      - [0.0, 0.0, 0.0, waypoint_a, {is_charger: [4, true], is_parking_spot: [4, true]}]
      - [10.0, 0.0, 0.0, corridor_west, {}]
      - [14.0, 0.0, 0.0, corridor_east, {}]
      - [24.0, 0.0, 0.0, waypoint_b, {is_charger: [4, true]}]
      - [12.0, 6.0, 0.0, lift_L1, {}]
    lanes:
      # Narrow corridor modeled as a directed ONE-WAY pair: RMF negotiation
      # serializes entry, preventing the head-on deadlock.
      - [1, 2, {bidirectional: [4, false]}]   # west -> east only
      - [2, 1, {bidirectional: [4, false]}]   # east -> west only (paired lane)
      - [0, 1, {bidirectional: [4, true]}]
      - [2, 3, {bidirectional: [4, true]}]
      - [1, 4, {bidirectional: [4, true]}]
  L2:
    elevation: 3.0
    vertices:
      - [12.0, 6.0, 0.0, lift_L2, {}]
      - [20.0, 6.0, 0.0, waypoint_c, {is_charger: [4, true]}]
      - [16.0, 6.0, 0.0, door_east_side, {}]
    doors:
      - [2, 1, {name: [1, door_L2], type: [1, sliding], motion_axis_orientation: [2, 1]}]
    lanes:
      - [0, 2, {bidirectional: [4, true]}]
      - [2, 1, {bidirectional: [4, true]}]
lifts:
  main_lift:
    reference_floor_name: L1
    levels: [L1, L2]
    doors: []
    x: 12.0
    y: 6.0
    yaw: 0.0
    width: 1.5
    depth: 1.5
