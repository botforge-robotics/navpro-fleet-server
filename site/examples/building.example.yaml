# Minimal RMF building for local bring-up / Devices tab.
# Filename MUST be *.building.yaml (Open-RMF building_map_server requirement).
#
# Author the real site in the Building traffic-editor tab, then Apply to fleet.
name: navpro_example
levels:
  L1:
    elevation: 0
    vertices:
      - [0.0, 0.0, 0.0, waypoint_a, {is_charger: [4, true], is_parking_spot: [4, true]}]
      - [10.0, 0.0, 0.0, corridor_west, {}]
      - [14.0, 0.0, 0.0, corridor_east, {}]
      - [24.0, 0.0, 0.0, waypoint_b, {is_charger: [4, true]}]
      - [12.0, 6.0, 0.0, lift_L1, {}]
    lanes:
      - [1, 2, {bidirectional: [4, false]}]
      - [2, 1, {bidirectional: [4, false]}]
      - [0, 1, {bidirectional: [4, true]}]
      - [2, 3, {bidirectional: [4, true]}]
      - [1, 4, {bidirectional: [4, true]}]
  L2:
    elevation: 3.0
    vertices:
      - [12.0, 6.0, 0.0, lift_L2, {}]
      - [20.0, 6.0, 0.0, waypoint_c, {is_charger: [4, true]}]
      - [16.0, 6.0, 0.0, door_east_side, {}]
    doors:
      - [2, 1, {name: [1, door_L2], type: [1, sliding], motion_axis_orientation: [2, 1]}]
    lanes:
      - [0, 2, {bidirectional: [4, true]}]
      - [2, 1, {bidirectional: [4, true]}]
lifts:
  main_lift:
    reference_floor_name: L1
    initial_floor_name: L1
    level_doors:
      L1: []
      L2: []
    doors: {}
    x: 12.0
    y: 6.0
    yaw: 0.0
    width: 1.5
    depth: 1.5
